<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MomzVeda — Offline</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F3EFFB;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
</style>
</head>
<body>
  <div style="width:100px;height:1.5px;background:linear-gradient(90deg,#1E90E8,#7A1FB0);border-radius:2px;opacity:0.4;margin-bottom:10px"></div>
  <div style="display:flex;align-items:baseline;margin-bottom:4px">
    <span style="font-family:'Archivo Black',sans-serif;font-size:28px;color:#1E90E8;letter-spacing:2px">Momz</span>
    <span style="font-family:'Playfair Display',serif;font-weight:400;font-style:italic;font-size:28px;color:#7A1FB0;letter-spacing:2px">Veda</span>
  </div>
  <div style="width:100px;height:1.5px;background:linear-gradient(90deg,#1E90E8,#7A1FB0);border-radius:2px;opacity:0.4;margin-bottom:32px"></div>

  <div style="font-size:48px;margin-bottom:16px">📱</div>
  <h1 style="font-size:22px;font-weight:700;color:#1B0B3B;margin-bottom:8px;font-family:'Playfair Display',serif">You're offline, mama</h1>
  <p style="font-size:15px;color:#5A1690;line-height:1.6;margin-bottom:24px;max-width:320px">
    No worries — I'll be right here when you reconnect. In the meantime, take a deep breath. You're doing amazing. 💚
  </p>

  <div style="background:#fff;border-radius:20px;padding:20px;max-width:320px;box-shadow:0 2px 16px rgba(30,144,232,0.08);border:1px solid #E9E0F7;margin-bottom:24px">
    <div style="font-size:12px;font-weight:600;color:#5A1690;letter-spacing:0.05em;margin-bottom:8px">✨ QUICK REMINDER</div>
    <div style="font-size:16px;color:#1B0B3B;line-height:1.6;font-family:'Playfair Display',serif;font-style:italic">
      You don't have to enjoy every moment to be a great mom. Some days you survive, and that counts too.
    </div>
  </div>

  <button onclick="window.location.reload()" style="background:linear-gradient(135deg,#1E90E8,#5A1690);color:#fff;border:none;border-radius:16px;padding:14px 32px;font-size:16px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(30,144,232,0.3)">
    Try Again
  </button>
</body>
</html>
